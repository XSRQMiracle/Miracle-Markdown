[package]
name = "miracle-markdown"
version = "0.1.0"
edition = "2021"
description = "A markdown editor that sets type the way TeX does"
default-run = "miracle-markdown"

[lib]
name = "miracle_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

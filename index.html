<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miracle Markdown</title>
    <style>
      :root {
        --chrome: #f7f6f3;
        --chrome-border: #e4e2dc;
        --ink: #2a2a28;
        --muted: #8a8880;
        --accent: #2f6f4f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font: 13px/1.4 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: #fdfdfb;
      }
      #app { display: flex; flex-direction: column; height: 100%; }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        height: 40px;
        flex: 0 0 40px;
        background: var(--chrome);
        border-bottom: 1px solid var(--chrome-border);
        -webkit-user-select: none;
        user-select: none;
      }
      header .title { font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
      header .spacer { flex: 1; }

      .toggles { display: flex; gap: 2px; }
      .toggle {
        border: 1px solid transparent;
        background: transparent;
        border-radius: 5px;
        padding: 4px 9px;
        font: inherit;
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }
      .toggle:hover { background: #ecebe6; }
      .toggle[aria-pressed="true"] {
        background: #fff;
        border-color: var(--chrome-border);
        color: var(--ink);
        font-weight: 500;
      }

      .sep { width: 1px; height: 18px; background: var(--chrome-border); }

      /* The math settings popover. Grouped the way the decisions actually
         divide: what counts as a formula, what LaTeX is available, and how
         equations are numbered. */
      #math-panel {
        position: absolute;
        top: 42px;
        z-index: 10;
        min-width: 330px;
        padding: 12px 14px 14px;
        background: #fff;
        border: 1px solid var(--chrome-border);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.13);
        font-size: 12.5px;
      }
      #math-panel[hidden] { display: none; }
      #math-panel h4 {
        margin: 14px 0 7px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #math-panel h4:first-child { margin-top: 0; }
      #math-panel label {
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding: 3px 0;
        cursor: pointer;
      }
      #math-panel label span.hint {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.35;
      }
      #math-panel select { font: inherit; margin-left: auto; }
      #math-panel .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
      #math-panel .note {
        margin-top: 10px;
        padding-top: 9px;
        border-top: 1px solid var(--chrome-border);
        color: var(--muted);
        line-height: 1.45;
      }

      /* The find bar. It floats over the top-right of the page rather than
         pushing the column around: the text under it must not reflow while a
         search is being typed, or the matches move as they are counted. */
      #find-bar {
        position: absolute;
        top: 10px;
        right: 18px;
        z-index: 9;
        display: grid;
        grid-template-columns: auto auto;
        gap: 6px;
        align-items: center;
        padding: 8px 10px;
        background: #fff;
        border: 1px solid var(--chrome-border);
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.13);
      }
      #find-bar[hidden] { display: none; }
      #find-bar .field {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px 2px 8px;
        border: 1px solid var(--chrome-border);
        border-radius: 5px;
        background: #fdfdfb;
      }
      #find-bar .field:focus-within { border-color: var(--accent); }
      #find-bar input {
        width: 190px;
        border: 0;
        outline: 0;
        background: transparent;
        font: inherit;
        color: var(--ink);
      }
      #find-bar .buttons { display: flex; align-items: center; gap: 2px; }
      #find-bar .toggle { padding: 3px 7px; }
      #find-bar .flag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      #find-count {
        min-width: 64px;
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
      }
      #find-bar.invalid .field { border-color: #c0503c; }

      label.slider { display: flex; align-items: center; gap: 6px; color: var(--muted); }
      label.slider input { width: 84px; }

      #stage { position: relative; flex: 1; overflow: hidden; }
      .document-dialog { max-width: 420px; border: 1px solid #d8d8d8; border-radius: 8px; padding: 24px; }
      .document-dialog::backdrop { background: #0005; }
      .document-dialog p { margin: 0 0 20px; line-height: 1.6; }
      .document-dialog div { display: flex; justify-content: end; gap: 12px; }
      #surface { display: block; width: 100%; height: 100%; cursor: text; }

      /* The input that collects keystrokes and hosts IME composition. It has
         to be in the layout and focusable — not display:none — or the
         candidate window has nowhere to anchor. */
      .hidden-input {
        position: absolute;
        width: 2px;
        padding: 0;
        border: 0;
        outline: 0;
        resize: none;
        overflow: hidden;
        opacity: 0;
        z-index: 1;
        background: transparent;
        color: transparent;
        caret-color: transparent;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        height: 26px;
        flex: 0 0 26px;
        background: var(--chrome);
        border-top: 1px solid var(--chrome-border);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
        -webkit-user-select: none;
        user-select: none;
      }
      footer .spacer { flex: 1; }
      footer b { font-weight: 600; color: var(--ink); }
      footer #mode:not(:empty) {
        padding: 1px 6px;
        border-radius: 4px;
        background: #e7e5df;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="title">Miracle Markdown</span>
        <div class="toggles">
          <button class="toggle" id="open" title="打开一个 Markdown 文件">打开</button>
          <button class="toggle" id="save" title="保存（⌘S）">保存</button>
          <button class="toggle" id="save-as" title="另存为（⌘⇧S）">另存为</button>
        </div>
        <span class="sep"></span>
        <div class="toggles" id="toggles"></div>
        <span class="sep"></span>
        <div class="toggles">
          <button class="toggle" id="math-button" title="公式设置">公式 ▾</button>
        </div>
        <span class="spacer"></span>
        <label class="slider">
          字号
          <input id="size" type="range" min="14" max="26" step="1" value="18" />
        </label>
        <label class="slider">
          版心
          <input id="column" type="range" min="420" max="1100" step="20" value="760" />
        </label>
      </header>
      <div id="stage">
        <canvas id="surface"></canvas>
        <div id="math-panel" hidden></div>
        <div id="find-bar" hidden>
          <div class="field">
            <input id="find-input" type="text" placeholder="查找" spellcheck="false" aria-label="查找" />
            <button class="toggle flag" id="find-case" title="区分大小写">Aa</button>
            <button class="toggle flag" id="find-regex" title="正则表达式">.*</button>
          </div>
          <div class="buttons">
            <span id="find-count"></span>
            <button class="toggle" id="find-prev" title="上一个（⇧⏎）">↑</button>
            <button class="toggle" id="find-next" title="下一个（⏎）">↓</button>
            <button class="toggle" id="find-close" title="关闭（Esc）">✕</button>
          </div>
          <div class="field">
            <input id="replace-input" type="text" placeholder="替换为" spellcheck="false" aria-label="替换为" />
          </div>
          <div class="buttons">
            <button class="toggle" id="replace-one" title="替换当前（⏎）">替换</button>
            <button class="toggle" id="replace-all" title="全部替换">全部</button>
          </div>
        </div>
      </div>
      <footer>
        <span id="status">正在加载排版引擎…</span>
        <span id="mode"></span>
        <span class="spacer"></span>
        <span id="perf"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
